<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kky | Link Bio</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    background:radial-gradient(circle at top, #2b0040, #070010);
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
}

/* PARTICLE BACKGROUND */
body::before{
    content:'';
    position:absolute;
    inset:0;
    background:url("https://www.transparenttextures.com/patterns/stardust.png");
    opacity:.15;
    animation:moveBg 30s linear infinite;
}

@keyframes moveBg{
    from{background-position:0 0;}
    to{background-position:1000px 1000px;}
}

/* CARD */
.card{
    position:relative;
    width:92%;
    max-width:420px;
    padding:32px 24px;
    border-radius:24px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(14px);
    box-shadow:0 0 45px rgba(255,0,255,.35);
    text-align:center;
    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0);}
}

/* PROFILE */
.profile{
    width:145px;
    height:145px;
    border-radius:50%;
    border:4px solid #ff4fd8;
    box-shadow:0 0 35px #ff4fd8;
    object-fit:cover;
    animation:pulse 3s infinite;
}

@keyframes pulse{
    0%{box-shadow:0 0 15px #ff4fd8;}
    50%{box-shadow:0 0 45px #ff4fd8;}
    100%{box-shadow:0 0 15px #ff4fd8;}
}

/* NAME */
h1{
    margin-top:18px;
    font-family:'Orbitron',sans-serif;
    letter-spacing:2px;
    font-size:28px;
    color:#ff9af2;
    text-shadow:0 0 15px #ff4fd8;
}

.tagline{
    font-size:13px;
    opacity:.85;
    margin:6px 0 22px;
}

/* BUTTON */
.btn{
    position:relative;
    display:block;
    padding:15px;
    margin:14px 0;
    border-radius:16px;
    background:linear-gradient(135deg,#ff4fd8,#9f6bff);
    color:#000;
    font-weight:600;
    text-decoration:none;
    overflow:hidden;
    box-shadow:0 0 20px rgba(255,79,216,.6);
    transition:.25s;
}

.btn::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.6),transparent);
    transform:translateX(-100%);
}

.btn:hover::after{
    animation:shine .8s;
}

@keyframes shine{
    to{transform:translateX(100%);}
}

.btn:hover{
    transform:scale(1.07);
    box-shadow:0 0 45px rgba(255,79,216,1);
}

/* FOOTER */
.footer{
    margin-top:20px;
    font-size:11px;
    opacity:.5;
}
</style>
</head>

<body>

<div class="card">

    <img src="gambarprofil.png" class="profile" alt="Kky">

    <h1>KKY</h1>
    <div class="tagline">🎮 Streamer | Gaming | Night Vibes</div>

    <a href="https://sociabuzz.com/kkykiw/tribe" target="_blank" class="btn">💖 Support Sociabuzz</a>
    <a href="https://tiktok.com/@dzakky90" target="_blank" class="btn">🔥 TikTok Live</a>
    <a href="https://instagram.com/yusufdzakky" target="_blank" class="btn">📸 Instagram</a>
    <a href="#" class="btn">💬 Discord</a>

    <div class="footer">© 2026 KKY</div>

</div>

</body>
</html>
