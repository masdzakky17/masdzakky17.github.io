<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kky | Link Bio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background: radial-gradient(circle at top, #2a003d, #0a0014);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
}

.card{
    width:90%;
    max-width:420px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(12px);
    border-radius:22px;
    padding:32px 24px;
    text-align:center;
    box-shadow:0 0 35px rgba(255,106,213,0.35);
    animation:fadeUp .8s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.profile-img{
    width:140px;
    height:140px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #ff6ad5;
    box-shadow:0 0 30px #ff6ad5;
    animation:pulse 3s infinite;
}

@keyframes pulse{
    0%{box-shadow:0 0 15px #ff6ad5;}
    50%{box-shadow:0 0 40px #ff6ad5;}
    100%{box-shadow:0 0 15px #ff6ad5;}
}

h2{
    margin:18px 0 6px;
    font-size:26px;
    color:#ffb3f6;
    text-shadow:0 0 12px #ff6ad5;
}

.bio{
    font-size:14px;
    opacity:.85;
    margin-bottom:22px;
}

.btn{
    display:block;
    width:100%;
    padding:14px;
    margin:12px 0;
    border-radius:14px;
    background:linear-gradient(135deg,#ff6ad5,#ffa6e7);
    color:#000;
    font-weight:600;
    text-decoration:none;
    box-shadow:0 0 18px rgba(255,106,213,.5);
    transition:.25s;
}

.btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 35px rgba(255,106,213,.9);
}

.footer{
    margin-top:20px;
    font-size:12px;
    opacity:.5;
}
</style>
</head>

<body>

<div class="card">

    <!-- ganti nama file sesuai foto kamu -->
    <img src="gambarprofil.png" class="profile-img" alt="Profile">

    <h2>Kky</h2>
    <div class="bio">Streamer | Game | Daily Content ✨</div>

    <a href="https://sociabuzz.com/kkykiw/tribe" target="_blank" class="btn">💖 Support via Sociabuzz</a>
    <a href="https://tiktok.com/@usernamekamu" target="_blank" class="btn">🎮 TikTok Live</a>
    <a href="https://instagram.com/usernamekamu" target="_blank" class="btn">📸 Instagram</a>

    <div class="footer">© 2026 • Kky</div>

</div>

</body>
</html>
